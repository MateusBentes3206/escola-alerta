# Blueprint do Render: um serviço web (API + front) e um PostgreSQL, tudo no plano gratuito.
# Render > New > Blueprint > escolha este repositório.
services:
  - type: web
    name: escolaalerta
    runtime: node
    plan: free
    region: ohio
    buildCommand: cd api && npm ci && npm run build
    startCommand: cd api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTO_SETUP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: escolaalerta-db
          property: connectionString

databases:
  - name: escolaalerta-db
    plan: free
    region: ohio
    databaseName: escolaalerta
    user: escolaalerta
