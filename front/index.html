<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EscolaAlerta — Protótipo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.0/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Kalam:wght@400;700&display=swap');

  :root {
    --bg: #0B0D10;
    --surface: #16181D;
    --surface-2: #1D2026;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.16);
    --text: #F4F5F7;
    --text-muted: #9AA1AC;
    --text-faint: #6B7280;
    --accent: #3D6BC7;
    --accent-hover: #4A78D6;
    --accent-glow: rgba(61,107,199,.28);
    --accent-glow-strong: rgba(61,107,199,.35);
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #F87171;
    --danger-border: rgba(248,113,113,.4);
    --sticky-bg: #362F1E;
    --sticky-border: rgba(251,191,36,.28);
    --sticky-text: #E8D9B8;
    --risco-baixo: #34D399;
    --risco-baixo-bg: #1B3A33;
    --risco-baixo-border: rgba(52,211,153,.35);
    --risco-moderado: #FBBF24;
    --risco-moderado-bg: #3F361E;
    --risco-moderado-border: rgba(251,191,36,.35);
    --risco-alto: #F87171;
    --risco-alto-bg: #3F282C;
    --risco-alto-border: rgba(248,113,113,.35);
  }

  [data-theme="light"] {
    --bg: #F6F3EC;
    --surface: #FFFFFF;
    --surface-2: #FCFAF5;
    --border: #E4DECE;
    --border-strong: #D9D2BF;
    --text: #23303A;
    --text-muted: #5C6B78;
    --text-faint: #6B604A;
    --accent: #223A5E;
    --accent-hover: #2C4A73;
    --accent-glow: rgba(34,58,94,.22);
    --accent-glow-strong: rgba(34,58,94,.3);
    --success: #2F6B3D;
    --warning: #8F5E0C;
    --danger: #A8382B;
    --danger-border: rgba(168,56,43,.4);
    --sticky-bg: #FCF3D9;
    --sticky-border: #E9D9A0;
    --sticky-text: #4A4022;
    --risco-baixo: #2F6B3D;
    --risco-baixo-bg: #EAF2EA;
    --risco-baixo-border: rgba(47,107,61,.35);
    --risco-moderado: #8F5E0C;
    --risco-moderado-bg: #FBF1DF;
    --risco-moderado-border: rgba(143,94,12,.35);
    --risco-alto: #A8382B;
    --risco-alto-bg: #FBE9E6;
    --risco-alto-border: rgba(168,56,43,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'IBM Plex Sans', sans-serif; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  #root { min-height: 100vh; }

  h1 { letter-spacing: -0.01em; text-wrap: balance; color: var(--text); }

  .skip-link {
    position: absolute; left: 12px; top: -48px;
    background: var(--accent); color: #fff; padding: 10px 16px;
    border-radius: 8px; font-weight: 700; font-size: 13px;
    text-decoration: none; z-index: 100; transition: top .15s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .skip-link:focus { top: 12px; }

  .eyebrow { font-family: 'Kalam', cursive; font-size: 13.5px; color: var(--text-faint); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.35); }

  .row-card {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left; padding: 16px 18px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-family: inherit;
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  .row-card:hover { border-color: var(--border-strong); background: var(--surface-2); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,0,0,.4); }
  .row-card:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(0,0,0,.4); }

  .field-label {
    display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: .04em;
  }

  .field {
    width: 100%; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--text);
  }
  .field::placeholder { color: var(--text-faint); }
  .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: var(--surface-2); }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: 1px solid rgba(0,0,0,.2);
    padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.4);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 8px 20px var(--accent-glow-strong); }
  .btn-primary:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .btn-primary:disabled { opacity: .4; box-shadow: none; transform: none; cursor: not-allowed; }

  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; color: var(--text); border: 1px solid var(--border-strong);
    padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .15s ease, border-color .15s ease;
  }
  .btn-secondary:hover { background: var(--surface-2); border-color: rgba(255,255,255,.24); }

  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

  .icon-btn {
    background: transparent; border: 1px solid var(--border-strong); color: var(--text);
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,.08); }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border: 1px solid; border-radius: 8px;
    padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .tab.is-inactive:hover { background: var(--surface-2) !important; color: var(--text) !important; }

  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .toast { animation: toast-in .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  .sticky-note {
    background: var(--sticky-bg); border: 1px solid var(--sticky-border); border-radius: 10px;
    padding: 12px 14px; font-size: 13.5px; color: var(--sticky-text); line-height: 1.5;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  .risk-badge {
    display: inline-flex; align-items: center; font-weight: 600;
    border-radius: 6px; text-transform: uppercase; letter-spacing: .02em;
  }

  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
</style>
<script>window.ESCOLAALERTA_API_URL = 'http://localhost:3333';</script>
<script src="api.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ---------------------------------------------------------
   EscolaAlerta — Protótipo de front-end (MVP)
   Sem conexão real com back-end: estado local simula a API
   e o motor de regras (correlação temporal) do pré-projeto.
--------------------------------------------------------- */

function Icon({ name, size = 16, color, style }) {
  return <i className={`fa-solid fa-${name}`} style={{ fontSize: size, color, lineHeight: 1, ...style }} />;
}

const TABS = {
  nota: { label: "Notas", color: "#2F6193", icon: "book-open" },
  falta: { label: "Frequência", color: "#96681C", icon: "calendar-xmark" },
  ocorrencia: { label: "Ocorrências", color: "#C44536", icon: "comment" },
  saida: { label: "Saídas", color: "#436E42", icon: "door-open" },
};

const CAUSA_LABEL = { faltas: "Frequência", notas: "Notas", ocorrencias: "Ocorrências", saidas: "Saídas antecipadas" };
const CAMPO_POR_TIPO = { nota: "notas", falta: "faltas", ocorrencia: "ocorrencias", saida: "saidas" };
const NIVEL_LABEL = { BAIXO: "baixo", MODERADO: "moderado", ALTO: "alto" };

function hojeIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

/* ---------------- adaptadores API <-> telas ----------------
   A API devolve indicadores numa lista única (tipo NOTA/FALTA/...); as telas do protótipo
   usam listas separadas por tipo. Converter aqui mantém as telas validadas sem alteração. */

function riscoDaApi(r) {
  return {
    nivel: r.nivel.toLowerCase(),
    causaPrincipal: r.causaRaiz ? r.causaRaiz.toLowerCase() : null,
    correlacao: !!r.correlacao,
    sinais: r.sinais || [],
    resumo: r.resumo || "",
  };
}

function alunoResumoDaApi(a) {
  return {
    id: a.id, nome: a.nome, turma: a.turma, responsavel: a.responsavel ? a.responsavel.nome : "—", risco: riscoDaApi(a.risco),
    planoStatus: a.planoStatus || null, atencao: !!a.atencao,
  };
}

function alunoDaApi(a) {
  const doTipo = (t) => a.indicadores.filter((i) => i.tipo === t);
  return {
    ...alunoResumoDaApi(a),
    notas: doTipo("NOTA").map((i) => ({ id: i.id, dataIso: i.data, disciplina: i.disciplina, assunto: i.assunto || "", valor: i.valor, periodo: i.periodo || "" })),
    faltas: doTipo("FALTA").map((i) => ({ id: i.id, dataIso: i.data, data: formatarData(i.data), justificada: i.justificada, comprovante: i.descricao || "" })),
    ocorrencias: doTipo("OCORRENCIA").map((i) => ({ id: i.id, dataIso: i.data, data: formatarData(i.data), descricao: i.descricao, gravidade: i.gravidade })),
    saidas: doTipo("SAIDA").map((i) => ({ id: i.id, dataIso: i.data, data: formatarData(i.data), horario: i.horario || "", motivo: i.descricao })),
    planoAcao: a.planoAtual
      ? {
          alertaId: a.planoAtual.alertaId,
          status: a.planoAtual.status,
          causa: a.planoAtual.causaRaiz ? a.planoAtual.causaRaiz.toLowerCase() : null,
          nivel: a.planoAtual.nivel.toLowerCase(),
          sugestoes: a.planoAtual.sugestoes.map((s) => s.texto),
          reforcos: a.planoAtual.reforcos || [],
        }
      : null,
    feedbacks: a.feedbacks.map((f) => ({ id: f.id, status: f.status, observacao: f.observacao, data: formatarData(f.criadoEm.slice(0, 10)) })),
    evolucao: a.evolucao,
    reforcosAtuais: a.reforcosAtuais || [],
  };
}

/** Dados de um formulário/edição -> corpo da API. Notas e ocorrências mantêm a data original ao editar. */
function indicadorParaApi(tipo, d) {
  const dataOriginal = d.dataIso ? { data: d.dataIso } : {};
  switch (tipo) {
    case "nota": return { tipo: "NOTA", disciplina: d.disciplina, assunto: d.assunto, valor: d.valor, periodo: d.periodo || null, ...dataOriginal };
    case "falta": return { tipo: "FALTA", data: d.data, justificada: !!d.justificada, descricao: d.comprovante || null };
    case "ocorrencia": return { tipo: "OCORRENCIA", descricao: d.descricao, gravidade: d.gravidade, ...dataOriginal };
    case "saida": return { tipo: "SAIDA", data: d.data, horario: d.horario || null, descricao: d.motivo };
  }
}

// O risco agora vem do motor de correlação da API; o front só exibe.
function classificarRisco(aluno) {
  return aluno.risco;
}

const RISCO_STYLE = {
  baixo: { cor: "var(--risco-baixo)", bg: "var(--risco-baixo-bg)", border: "var(--risco-baixo-border)", label: "Risco baixo" },
  moderado: { cor: "var(--risco-moderado)", bg: "var(--risco-moderado-bg)", border: "var(--risco-moderado-border)", label: "Risco moderado" },
  alto: { cor: "var(--risco-alto)", bg: "var(--risco-alto-bg)", border: "var(--risco-alto-border)", label: "Risco alto" },
};

function App() {
  const [alunos, setAlunos] = useState([]);
  const [aluno, setAluno] = useState(null); // detalhe do aluno aberto, vindo de GET /alunos/:id
  const [notificacoes, setNotificacoes] = useState([]);
  const [solicitacoes, setSolicitacoes] = useState([]);
  const [perfil, setPerfil] = useState(null);
  const [tela, setTela] = useState("login");
  const [toast, setToast] = useState(null);
  const [tema, setTema] = useState("claro"); // claro como padrão: projeta melhor; o botão de trocar continua

  function alternarTema() {
    setTema((t) => (t === "escuro" ? "claro" : "escuro"));
  }

  function mostrarToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 4200);
  }

  const falhou = (err) => mostrarToast(err.message || "Algo deu errado. Tente novamente.");

  async function carregarAlunos() {
    const lista = await api.get("/alunos");
    setAlunos(lista.map(alunoResumoDaApi));
    return lista;
  }

  async function carregarNotificacoes() {
    try { setNotificacoes(await api.get("/notificacoes")); } catch (e) { /* avisos não bloqueiam o uso */ }
  }

  async function carregarSolicitacoes() {
    try { setSolicitacoes(await api.get("/solicitacoes")); } catch (e) { /* idem */ }
  }

  async function abrirAluno(id, proximaTela) {
    try {
      setAluno(alunoDaApi(await api.get(`/alunos/${id}`)));
      if (proximaTela) setTela(proximaTela);
    } catch (e) {
      falhou(e);
    }
  }

  // O perfil vem da conta (API), não de um botão escolhido na tela.
  async function entrar(usuario) {
    const perfilEscolhido = usuario.perfil === "ORIENTADOR" ? "orientador" : "responsavel";
    setPerfil(perfilEscolhido);
    mostrarToast(`Bem-vindo(a), ${usuario.nome.split(" ")[0]}.`);
    try {
      const lista = await carregarAlunos();
      carregarNotificacoes();
      carregarSolicitacoes();
      if (perfilEscolhido === "orientador") setTela("orientador-dashboard");
      else if (lista.length > 0) await abrirAluno(lista[0].id, "responsavel-painel");
      else setTela("responsavel-vazio");
    } catch (e) {
      falhou(e);
    }
  }

  function sair() {
    api.logout();
    setPerfil(null);
    setAluno(null);
    setAlunos([]);
    setNotificacoes([]);
    setSolicitacoes([]);
    setTela("login");
  }

  // Se o token expirar no meio do uso, volta para o login com aviso.
  useEffect(() => {
    api.aoExpirarSessao(() => {
      sair();
      mostrarToast("Sua sessão expirou. Entre novamente.");
    });
    // Recarregou a página com sessão ativa: entra direto.
    if (api.sessao.token && api.sessao.usuario) entrar(api.sessao.usuario);
  }, []);

  // Toda alteração de indicador volta com o risco recalculado e, se mudou, o alerta gerado.
  async function alterarIndicador(requisicao, mensagem) {
    try {
      const resultado = await requisicao;
      await abrirAluno(aluno.id);
      carregarAlunos();
      carregarNotificacoes();
      const alerta = resultado.alertaGerado;
      mostrarToast(alerta
        ? `${mensagem} O motor gerou um novo alerta: risco ${NIVEL_LABEL[alerta.nivel]}.`
        : `${mensagem} Risco recalculado pelo motor de regras.`);
    } catch (e) {
      falhou(e);
    }
  }

  async function marcarLida(id) {
    setNotificacoes((lista) => lista.map((n) => (n.id === id ? { ...n, lida: true } : n)));
    try { await api.patch(`/notificacoes/${id}/lida`); } catch (e) { carregarNotificacoes(); }
  }

  async function mudarStatusPlano(status) {
    try {
      await api.patch(`/alertas/${aluno.planoAcao.alertaId}/plano`, { status });
      await abrirAluno(aluno.id);
      carregarAlunos();
      mostrarToast(status === "RESOLVIDO" ? "Plano marcado como resolvido. A família foi avisada." : "Plano marcado como em andamento.");
    } catch (e) {
      falhou(e);
    }
  }

  async function responderSolicitacao(id, corpo) {
    try {
      await api.patch(`/solicitacoes/${id}`, corpo);
      await carregarSolicitacoes();
      carregarNotificacoes();
      const msg = { confirmar: "Conversa confirmada. A família foi avisada.", remarcar: "Novo horário enviado para a família.",
        recusar: "Pedido recusado. A família recebeu a justificativa.", concluir: "Conversa marcada como concluída.",
        aceitar: "Novo horário aceito. O orientador foi avisado." }[corpo.acao];
      mostrarToast(msg);
      return true;
    } catch (e) {
      falhou(e);
      return false;
    }
  }

  async function agendarConversa(dados) {
    try {
      await api.post(`/alunos/${aluno.id}/solicitacoes`, dados);
      await carregarSolicitacoes();
      mostrarToast("Pedido de conversa enviado ao orientador.");
      return true;
    } catch (e) {
      falhou(e);
      return false;
    }
  }

  const avisos = <Avisos notificacoes={notificacoes} onMarcarLida={marcarLida} />;

  return (
    <div data-theme={tema === "claro" ? "light" : undefined} style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: "var(--bg)", minHeight: "100vh", color: "var(--text)" }}>
      <a href="#main-content" className="skip-link">Pular para o conteúdo</a>
      {tela !== "login" && (
        <TopBar
          perfil={perfil}
          tema={tema}
          onAlternarTema={alternarTema}
          onVoltar={
            tela === "orientador-dashboard" || tela === "responsavel-painel" || tela === "responsavel-vazio"
              ? null
              : () => setTela(perfil === "orientador" ? "orientador-dashboard" : "responsavel-painel")
          }
          onSair={sair}
          solicitacoesPendentes={perfil === "orientador" ? solicitacoes.filter((s) => s.status === "PENDENTE").length : null}
          onSolicitacoes={() => { carregarSolicitacoes(); setTela("orientador-solicitacoes"); }}
        />
      )}

      {tela === "login" && <Login onEntrar={entrar} tema={tema} onAlternarTema={alternarTema} />}

      {tela === "orientador-dashboard" && (
        <OrientadorDashboard
          alunos={alunos}
          avisos={avisos}
          onNovoAluno={() => setTela("orientador-cadastro")}
          onAbrirAluno={(id) => abrirAluno(id, "orientador-indicador")}
        />
      )}

      {tela === "orientador-cadastro" && (
        <CadastrarAluno
          onCancelar={() => setTela("orientador-dashboard")}
          onSalvar={async (novo) => {
            try {
              await api.post("/alunos", novo);
              await carregarAlunos();
              mostrarToast(`Aluno ${novo.nome} cadastrado.`);
              setTela("orientador-dashboard");
            } catch (e) {
              falhou(e);
            }
          }}
        />
      )}

      {tela === "orientador-indicador" && aluno && (
        <RegistrarIndicador
          aluno={aluno}
          onStatusPlano={mudarStatusPlano}
          onRegistrar={(tipo, dados) =>
            alterarIndicador(api.post(`/alunos/${aluno.id}/indicadores`, indicadorParaApi(tipo, dados)), "Indicador registrado.")}
          onExcluir={(tipo, indicadorId) =>
            alterarIndicador(api.del(`/indicadores/${indicadorId}`), "Registro excluído.")}
          onEditar={(tipo, indicadorId, novosDados) => {
            const original = aluno[CAMPO_POR_TIPO[tipo]].find((item) => item.id === indicadorId);
            alterarIndicador(api.patch(`/indicadores/${indicadorId}`, indicadorParaApi(tipo, { ...original, ...novosDados })), "Registro atualizado.");
          }}
        />
      )}

      {tela === "orientador-solicitacoes" && (
        <CaixaDeSolicitacoes
          solicitacoes={solicitacoes}
          onResponder={responderSolicitacao}
          onAbrirAluno={(id) => abrirAluno(id, "orientador-indicador")}
        />
      )}

      {tela === "responsavel-painel" && aluno && (
        <PainelResponsavel
          aluno={aluno}
          avisos={avisos}
          filhos={alunos}
          onTrocarAluno={(id) => abrirAluno(id)}
          onVerPlano={() => setTela("responsavel-plano")}
        />
      )}

      {tela === "responsavel-vazio" && (
        <Page>
          {avisos}
          <p style={{ color: "var(--text-muted)" }}>Nenhum aluno vinculado à sua conta ainda. Procure a orientação da escola.</p>
        </Page>
      )}

      {tela === "responsavel-plano" && aluno && (
        <PlanoDeAcao
          aluno={aluno}
          solicitacoes={solicitacoes.filter((s) => s.alunoId === aluno.id)}
          onAgendar={agendarConversa}
          onAceitar={(id) => responderSolicitacao(id, { acao: "aceitar" })}
          onFeedback={async (status, observacao) => {
            try {
              await api.post(`/alertas/${aluno.planoAcao.alertaId}/feedback`, { status, observacao });
              await abrirAluno(aluno.id);
              mostrarToast("Feedback registrado e enviado para a escola. Obrigado por acompanhar!");
            } catch (e) {
              falhou(e);
            }
          }}
        />
      )}

      {toast && <Toast texto={toast} onFechar={() => setToast(null)} />}
    </div>
  );
}

/** Histórico de evolução do risco (RF08): cada mudança de nível gravada pelo motor. */
/** Histórico de evolução do risco (RF08): gráfico em degraus, um ponto por alerta gravado pelo motor. */
function EvolucaoRisco({ evolucao, atual }) {
  if (!evolucao || evolucao.length === 0) return null;
  const Y = { ALTO: 18, MODERADO: 52, BAIXO: 86 };
  const COR = { ALTO: "var(--risco-alto)", MODERADO: "var(--risco-moderado)", BAIXO: "var(--risco-baixo)" };
  const pontos = evolucao.map((e) => ({ t: new Date(e.criadoEm).getTime(), nivel: e.nivel, rotulo: formatarData(e.criadoEm.slice(0, 10)), e }));
  const hoje = { t: Math.max(Date.now(), pontos[pontos.length - 1].t + 1), nivel: (atual || pontos[pontos.length - 1].nivel).toUpperCase(), rotulo: "hoje" };
  const todos = [...pontos, hoje];
  const t0 = todos[0].t, t1 = todos[todos.length - 1].t;
  const X0 = 78, X1 = 580;
  const x = (t) => (t1 === t0 ? X0 : X0 + ((t - t0) / (t1 - t0)) * (X1 - X0));
  // degraus: o nível vale até o próximo alerta
  let d = `M ${x(todos[0].t)} ${Y[todos[0].nivel]}`;
  for (let i = 1; i < todos.length; i++) d += ` H ${x(todos[i].t)} V ${Y[todos[i].nivel]}`;

  return (
    <figure style={{ margin: "12px 0 0" }}>
      <figcaption style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-muted)", marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}>
        <Icon name="chart-line" size={12} /> Evolução do risco
      </figcaption>
      <div style={{ overflowX: "auto" }}>
        <svg viewBox="0 0 600 112" style={{ width: "100%", minWidth: 360, height: "auto", display: "block" }} role="img"
          aria-label={`Evolução do risco: ${todos.map((p) => `${p.rotulo} ${NIVEL_LABEL[p.nivel]}`).join(", ")}`}>
          {Object.entries(Y).map(([nivel, y]) => (
            <g key={nivel}>
              <line x1={X0} x2={X1} y1={y} y2={y} stroke="var(--border)" strokeDasharray="3 4" />
              <text x={X0 - 10} y={y + 4} textAnchor="end" fontSize="11" fill={COR[nivel]} fontWeight="600">{NIVEL_LABEL[nivel]}</text>
            </g>
          ))}
          <path d={d} fill="none" stroke="var(--text-muted)" strokeWidth="2" />
          {todos.map((p, i) => (
            <g key={i}>
              <circle cx={x(p.t)} cy={Y[p.nivel]} r={p.rotulo === "hoje" ? 4 : 5.5} fill={COR[p.nivel]} stroke="var(--surface)" strokeWidth="2">
                {p.e && <title>{`${p.rotulo}: risco ${NIVEL_LABEL[p.nivel]}${p.e.regraOrigem ? ` (${p.e.regraOrigem}${p.e.correlacao ? ", correlação" : ""})` : ""}`}</title>}
              </circle>
              <text x={x(p.t)} y={108} textAnchor={i === 0 ? "start" : i === todos.length - 1 ? "end" : "middle"} fontSize="10.5" fill="var(--text-faint)">{p.rotulo}</text>
            </g>
          ))}
        </svg>
      </div>
    </figure>
  );
}

};

const DIAS_SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];

/* Dias úteis: mesma regra da API (api/src/domain/calendario.ts), aqui só para avisar na hora.
   Segunda a sexta, exceto feriados nacionais (fixos + Sexta-feira Santa). */
const FERIADOS_FIXOS = { "01-01": "Confraternização Universal", "04-21": "Tiradentes", "05-01": "Dia do Trabalho", "09-07": "Independência",
  "10-12": "Nossa Senhora Aparecida", "11-02": "Finados", "11-15": "Proclamação da República", "11-20": "Consciência Negra", "12-25": "Natal" };

function sextaFeiraSanta(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const pascoa = new Date(Date.UTC(ano, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1));
  pascoa.setUTCDate(pascoa.getUTCDate() - 2);
  return pascoa.toISOString().slice(0, 10);
}

/** null se for dia útil; senão o motivo ("sábado", "feriado (Finados)"...). */
function motivoNaoUtil(h) {
  if (!h) return null;
  const data = h.slice(0, 10);
  const [y, m, d] = data.split("-").map(Number);
  const dia = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  if (dia === 0) return "domingo";
  if (dia === 6) return "sábado";
  if (FERIADOS_FIXOS[data.slice(5)]) return `feriado (${FERIADOS_FIXOS[data.slice(5)]})`;
  if (data === sextaFeiraSanta(y)) return "feriado (Sexta-feira Santa)";
  return null;
}

// Janela de atendimento da escola (mesma da API: HORARIO_ATENDIMENTO em calendario.ts).
const HORARIO_ATENDIMENTO = { inicio: "07:00", fim: "17:00" };

/** null se o horário serve para agendar; senão a mensagem do problema (dia não útil ou fora do atendimento). */
function problemaNoHorario(h) {
  if (!h) return null;
  const motivo = motivoNaoUtil(h);
  if (motivo) return `Escolha um dia útil: essa data é ${motivo}.`;
  const hora = h.slice(11, 16);
  if (hora < HORARIO_ATENDIMENTO.inicio || hora > HORARIO_ATENDIMENTO.fim) {
    return `Escolha um horário entre ${HORARIO_ATENDIMENTO.inicio} e ${HORARIO_ATENDIMENTO.fim}.`;
  }
  return null;
}

function AvisoDiaUtil({ horario }) {
  const problema = problemaNoHorario(horario);
  if (!problema) return null;
  return <p role="alert" style={{ fontSize: 12, color: "var(--danger)", margin: "4px 0 0" }}>{problema}</p>;
}

function formatarHorario(h) {
  if (!h) return "";
  const [data, hora] = h.split("T");
  const [y, m, d] = data.split("-").map(Number);
  return `${DIAS_SEMANA[new Date(y, m - 1, d).getDay()]}, ${String(d).padStart(2, "0")}/${String(m).padStart(2, "0")} às ${hora}`;
}

      ) : !abrindo ? (
        <button type="button" className="btn-primary" style={{ width: "100%", justifyContent: "center" }} onClick={() => setAbrindo(true)}>
          <Icon name="calendar-plus" size={15} /> Agendar conversa com o orientador
        </button>
      ) : (
        <form
          onSubmit={async (e) => {
            e.preventDefault();
            if (preenchidas.length === 0 || temDiaNaoUtil || enviando) return;
            setEnviando(true);
            const ok = await onAgendar({ motivo, opcoes: preenchidas, formato, observacao: observacao.trim() || null });
            setEnviando(false);
            if (ok) { setAbrindo(false); setOpcoes(["", "", ""]); setObservacao(""); }
          }}
        >
          <label className="field-label" htmlFor="agendar-motivo">Motivo</label>
          <input id="agendar-motivo" className="field" value={motivo} readOnly />
          <div className="field-label" style={{ marginTop: 14 }}>Sugira até 3 horários</div>
          <p style={{ fontSize: 12, color: "var(--text-muted)", margin: "0 0 6px" }}>Somente dias úteis (segunda a sexta, exceto feriados nacionais), das {HORARIO_ATENDIMENTO.inicio} às {HORARIO_ATENDIMENTO.fim}.</p>
          <div style={{ display: "grid", gap: 8 }}>
            {opcoes.map((o, i) => (
              <div key={i}>
                <input
                  type="datetime-local" className="field" min={agora} value={o} aria-label={`Opção de horário ${i + 1}`}
                  aria-invalid={!!problemaNoHorario(o)}
                  onChange={(e) => setOpcoes((l) => l.map((x, j) => (j === i ? e.target.value : x)))}
                />
                <AvisoDiaUtil horario={o} />
              </div>
            ))}
          </div>
          <label className="field-label" htmlFor="agendar-formato" style={{ marginTop: 14 }}>Formato</label>
          <select id="agendar-formato" className="field" value={formato} onChange={(e) => setFormato(e.target.value)}>
            <option value="PRESENCIAL">Presencial na escola</option>
            <option value="LIGACAO">Ligação</option>
            <option value="VIDEO">Chamada de vídeo</option>
          </select>
          <label className="field-label" htmlFor="agendar-obs" style={{ marginTop: 14 }}>Observação</label>
          <textarea id="agendar-obs" className="field" rows={2} value={observacao} onChange={(e) => setObservacao(e.target.value)} placeholder="ex.: prefiro no fim da tarde" />
          <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
            <button type="button" className="btn-ghost" style={{ flex: 1 }} onClick={() => setAbrindo(false)}>Cancelar</button>
            <button type="submit" className="btn-primary" style={{ flex: 1, justifyContent: "center" }} disabled={preenchidas.length === 0 || temDiaNaoUtil || enviando}>
              {enviando ? "Enviando..." : "Enviar pedido"}
            </button>
          </div>
        </form>
      )}
    </section>
  );
}

/** Orientador: caixa de solicitações de conversa, com filtro por status. */
function CaixaDeSolicitacoes({ solicitacoes, onResponder, onAbrirAluno }) {
  const [filtro, setFiltro] = useState("pendentes");
  const FILTROS = {
    pendentes: ["PENDENTE", "REMARCADA"], confirmadas: ["CONFIRMADA"], concluidas: ["CONCLUIDA"], recusadas: ["RECUSADA"],
  };
  const lista = solicitacoes.filter((s) => FILTROS[filtro].includes(s.status));
  const contar = (f) => solicitacoes.filter((s) => FILTROS[f].includes(s.status)).length;

  return (
    <Page max={760}>
      <div className="eyebrow">agenda com as famílias</div>
      <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, margin: "4px 0 18px" }}>Solicitações de conversa</h1>
      <div className="tabs" role="tablist">
        {[["pendentes", "Pendentes"], ["confirmadas", "Confirmadas"], ["concluidas", "Concluídas"], ["recusadas", "Recusadas"]].map(([k, l]) => (
          <button
            key={k} role="tab" aria-selected={filtro === k} onClick={() => setFiltro(k)} className={filtro === k ? "tab" : "tab is-inactive"}
            style={{ background: filtro === k ? "var(--accent)" : "transparent", color: filtro === k ? "#fff" : "var(--text-muted)", borderColor: "var(--accent)" }}
          >
            {l} ({contar(k)})
          </button>
        ))}
      </div>
      {lista.length === 0 ? (
        <p style={{ fontSize: 13.5, color: "var(--text-muted)" }}>Nenhuma solicitação aqui.</p>
      ) : (
        <ul style={{ listStyle: "none", margin: 0, padding: 0, display: "grid", gap: 12 }}>
          {lista.map((s) => <ItemSolicitacao key={s.id} s={s} onResponder={onResponder} onAbrirAluno={onAbrirAluno} />)}
        </ul>
      )}
    </Page>
  );
}

function ItemSolicitacao({ s, onResponder, onAbrirAluno }) {
  const [modo, setModo] = useState(null); // null | "remarcar" | "recusar"
  const [horario, setHorario] = useState("");
  const [texto, setTexto] = useState("");
  const rs = RISCO_STYLE[s.nivelRisco.toLowerCase()];
  const agora = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const enviar = async (corpo) => { if (await onResponder(s.id, corpo)) { setModo(null); setHorario(""); setTexto(""); } };

  return (
    <li className="card" style={{ padding: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <button type="button" onClick={() => onAbrirAluno(s.alunoId)} style={{ background: "none", border: "none", padding: 0, color: "var(--text)", fontWeight: 600, fontSize: 15, cursor: "pointer" }}>
          {s.alunoNome}
        </button>
        <span style={{ fontSize: 13, color: "var(--text-muted)" }}>{s.turma}</span>
        <Selo estilo={rs}>{rs.label}</Selo>
        <span style={{ flex: 1 }} />
        <Selo estilo={STATUS_SOLICITACAO[s.status]} />
      </div>
      <p style={{ fontSize: 13.5, margin: "8px 0 0", color: "var(--text-muted)" }}>
        {s.responsavelNome} · {FORMATO_LABEL[s.formato]} · motivo: <strong style={{ color: "var(--text)" }}>{s.motivo}</strong>
      </p>
      {s.observacao && <p style={{ fontSize: 13.5, margin: "6px 0 0" }}>"{s.observacao}"</p>}

      {s.status === "PENDENTE" && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-muted)", marginBottom: 6 }}>HORÁRIOS PROPOSTOS: CLIQUE PARA CONFIRMAR</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {s.opcoes.map((o) => (
              <button key={o} type="button" className="btn-ghost" style={{ padding: "7px 12px", fontSize: 13 }} onClick={() => enviar({ acao: "confirmar", horario: o })}>
                <Icon name="check" size={12} /> {formatarHorario(o)}
              </button>
            ))}
          </div>
        </div>
      )}
      {(s.status === "CONFIRMADA" || s.status === "REMARCADA" || s.status === "CONCLUIDA") && s.horarioDefinido && (
        <p style={{ fontSize: 13.5, margin: "10px 0 0" }}>
          <Icon name="clock" size={12} style={{ marginRight: 6 }} />
          <strong>{formatarHorario(s.horarioDefinido)}</strong>
          {s.status === "REMARCADA" && <span style={{ color: "var(--text-muted)" }}> (aguardando a família aceitar)</span>}
        </p>
      )}
      {s.resposta && <p style={{ fontSize: 13, color: "var(--text-muted)", margin: "6px 0 0" }}>Sua resposta: "{s.resposta}"</p>}

      {(s.status === "PENDENTE" || s.status === "REMARCADA") && !modo && (
        <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
          <button type="button" className="btn-ghost" style={{ padding: "7px 12px", fontSize: 13 }} onClick={() => setModo("remarcar")}>
            <Icon name="calendar-days" size={12} /> Propor outro horário
          </button>
          <button type="button" className="btn-ghost" style={{ padding: "7px 12px", fontSize: 13, color: "var(--danger)", borderColor: "var(--danger-border)" }} onClick={() => setModo("recusar")}>
            <Icon name="xmark" size={12} /> Recusar
          </button>
        </div>
      )}
      {s.status === "CONFIRMADA" && (
        <button type="button" className="btn-primary" style={{ marginTop: 12, padding: "7px 14px", fontSize: 13 }} onClick={() => enviar({ acao: "concluir" })}>
          <Icon name="circle-check" size={13} /> Marcar conversa como concluída
        </button>
      )}

      {modo === "remarcar" && (
        <div style={{ marginTop: 12, display: "grid", gap: 8 }}>
          <div>
            <input type="datetime-local" className="field" min={agora} value={horario} onChange={(e) => setHorario(e.target.value)} aria-label="Novo horário" aria-invalid={!!problemaNoHorario(horario)} />
            <AvisoDiaUtil horario={horario} />
          </div>
          <input className="field" value={texto} onChange={(e) => setTexto(e.target.value)} placeholder="Mensagem para a família (opcional)" aria-label="Mensagem para a família" />
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" className="btn-primary" disabled={!horario || !!problemaNoHorario(horario)} style={{ padding: "7px 14px", fontSize: 13 }} onClick={() => enviar({ acao: "remarcar", horario, mensagem: texto.trim() || null })}>Enviar novo horário</button>
            <button type="button" className="btn-ghost" style={{ padding: "7px 14px", fontSize: 13 }} onClick={() => setModo(null)}>Cancelar</button>
          </div>
        </div>
      )}
      {modo === "recusar" && (
        <div style={{ marginTop: 12, display: "grid", gap: 8 }}>
          <textarea className="field" rows={2} value={texto} onChange={(e) => setTexto(e.target.value)} placeholder="Justificativa (obrigatória)" aria-label="Justificativa da recusa" />
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" className="btn-primary" disabled={texto.trim().length < 3} style={{ padding: "7px 14px", fontSize: 13 }} onClick={() => enviar({ acao: "recusar", justificativa: texto.trim() })}>Recusar pedido</button>
            <button type="button" className="btn-ghost" style={{ padding: "7px 14px", fontSize: 13 }} onClick={() => setModo(null)}>Cancelar</button>
          </div>
        </div>
      )}
    </li>
  );
}

/** Cards de resumo da turma; clicar filtra a lista. */
function ResumoTurma({ alunos, filtro, onFiltrar }) {
  const n = (f) => alunos.filter(f).length;
  const cards = [
    ["atencao", "Precisam de atenção", n((a) => a.atencao), "var(--accent)"],
    ["alto", "Risco alto", n((a) => a.risco.nivel === "alto"), "var(--risco-alto)"],
    ["moderado", "Risco moderado", n((a) => a.risco.nivel === "moderado"), "var(--risco-moderado)"],
    ["baixo", "Risco baixo", n((a) => a.risco.nivel === "baixo"), "var(--risco-baixo)"],
  ];
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 18 }}>
      {cards.map(([chave, label, total, cor]) => (
        <button
          key={chave} type="button" className="card" aria-pressed={filtro === chave}
          onClick={() => onFiltrar(filtro === chave ? "todos" : chave)}
          style={{ padding: "12px 14px", textAlign: "left", cursor: "pointer", borderLeft: `3px solid ${cor}`, outline: filtro === chave ? `2px solid ${cor}` : "none", color: "var(--text)" }}
        >
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: cor, lineHeight: 1 }}>{total}</div>
          <div style={{ fontSize: 12.5, color: "var(--text-muted)", marginTop: 6 }}>{label}</div>
        </button>
      ))}
    </div>
  );
}

/* ---------------------- LOGIN ---------------------- */

function Login({ onEntrar, tema, onAlternarTema }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState("");
  const invalido = !email.trim() || !senha;

  async function enviar(e) {
    e.preventDefault();
    if (invalido || carregando) return;
    setErro("");
    setCarregando(true);
    try {
      const usuario = await api.login(email, senha);
      onEntrar(usuario);
    } catch (err) {
      setErro(err.message);
    } finally {
      setCarregando(false);
    }
  }

  return (
    <main id="main-content" style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, position: "relative" }}>
      <button
        onClick={onAlternarTema} className="icon-btn"
        aria-label={tema === "claro" ? "Ativar modo escuro" : "Ativar modo claro"}
        style={{ position: "absolute", top: 20, right: 20, color: "var(--text-muted)", borderColor: "var(--border-strong)" }}
      >
        <Icon name={tema === "claro" ? "moon" : "sun"} size={15} />
      </button>
      <div style={{ width: "100%", maxWidth: 420 }}>
        <div style={{ textAlign: "center", marginBottom: 34 }}>
          <div style={{
            width: 56, height: 56, borderRadius: 12, background: "var(--accent)", color: "#fff",
            boxShadow: "0 8px 20px var(--accent-glow-strong)",
            display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px",
          }}>
            <Icon name="school" size={26} />
          </div>
          <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 28, margin: 0 }}>EscolaAlerta</h1>
          <p style={{ color: "var(--text-muted)", fontSize: 14, marginTop: 8, lineHeight: 1.5 }}>
            Acompanhamento acadêmico e comportamental para famílias e escola, com alerta antecipado de risco.
          </p>
        </div>

        <form className="card" style={{ padding: 22 }} onSubmit={enviar} noValidate>
          <label className="field-label" htmlFor="login-email">E-mail</label>
          <input
            id="login-email" className="field" type="email" autoComplete="email" placeholder="voce@escola.com.br"
            value={email} onChange={(e) => setEmail(e.target.value)} disabled={carregando}
          />
          <label className="field-label" htmlFor="login-senha" style={{ marginTop: 14 }}>Senha</label>
          <input
            id="login-senha" className="field" type="password" autoComplete="current-password"
            value={senha} onChange={(e) => setSenha(e.target.value)} disabled={carregando}
          />

          {erro && (
            <p role="alert" style={{ fontSize: 13, color: "var(--danger)", margin: "12px 0 0" }}>
              <Icon name="circle-exclamation" size={13} style={{ marginRight: 6 }} />{erro}
            </p>
          )}

          <button
            type="submit" className="btn-primary"
            style={{ marginTop: 18, width: "100%", justifyContent: "center" }}
            disabled={invalido || carregando} aria-busy={carregando}
            aria-describedby={invalido ? "login-hint" : undefined}
          >
            {carregando
              ? <><Icon name="spinner" size={15} style={{ animation: "fa-spin 1s linear infinite" }} /> Entrando...</>
              : <><Icon name="right-to-bracket" size={15} /> Entrar</>}
          </button>
          {invalido && (
            <p id="login-hint" style={{ fontSize: 12.5, color: "var(--text-muted)", marginTop: 8 }}>
              Preencha e-mail e senha para entrar.
            </p>
          )}
        </form>
      </div>
    </main>
  );
}

/* ---------------------- ORIENTADOR: dashboard ---------------------- */

function OrientadorDashboard({ alunos, avisos, onNovoAluno, onAbrirAluno }) {
  const [busca, setBusca] = useState("");
  const [filtroRisco, setFiltroRisco] = useState("todos");

  // Quem precisa de atenção primeiro; depois risco alto, moderado, baixo; depois nome.
  const ORDEM = { alto: 0, moderado: 1, baixo: 2 };
  const alunosComRisco = alunos
    .map((aluno) => ({ aluno, nivel: classificarRisco(aluno).nivel }))
    .sort((a, b) => (b.aluno.atencao - a.aluno.atencao) || (ORDEM[a.nivel] - ORDEM[b.nivel]) || a.aluno.nome.localeCompare(b.aluno.nome));
  const alunosFiltrados = alunosComRisco.filter(({ aluno, nivel }) => {
    const combinaBusca = aluno.nome.toLowerCase().includes(busca.trim().toLowerCase());
    const combinaRisco = filtroRisco === "todos" || nivel === filtroRisco || (filtroRisco === "atencao" && aluno.atencao);
    return combinaBusca && combinaRisco;
  });
  const filtroAtivo = busca.trim() !== "" || filtroRisco !== "todos";

  return (
    <Page max={760}>
      {avisos}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22, gap: 12, flexWrap: "wrap" }}>
        <div>
          <div className="eyebrow">turma sob acompanhamento</div>
          <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, margin: "4px 0 0" }}>Seus alunos</h1>
        </div>
        <button className="btn-primary" onClick={onNovoAluno}>
          <Icon name="plus" size={15} /> Cadastrar aluno
        </button>
      </div>

      <ResumoTurma alunos={alunos} filtro={filtroRisco} onFiltrar={setFiltroRisco} />

      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 200px" }}>
          <label className="field-label" htmlFor="busca-aluno">Buscar por nome</label>
          <input
            id="busca-aluno" className="field" value={busca} onChange={(e) => setBusca(e.target.value)}
            placeholder="ex.: Rafael" autoComplete="off"
          />
        </div>
        <div style={{ flex: "0 1 180px" }}>
          <label className="field-label" htmlFor="filtro-risco">Nível de risco</label>
          <select id="filtro-risco" className="field" value={filtroRisco} onChange={(e) => setFiltroRisco(e.target.value)}>
            <option value="todos">Todos</option>
            <option value="atencao">Precisam de atenção</option>
            <option value="alto">Risco alto</option>
            <option value="moderado">Risco moderado</option>
            <option value="baixo">Risco baixo</option>
          </select>
        </div>
      </div>

      {alunosFiltrados.length === 0 ? (
        <p style={{ fontSize: 13.5, color: "var(--text-muted)" }}>
          Nenhum aluno encontrado{filtroAtivo ? " com esse filtro." : "."}
        </p>
      ) : (
        <ul style={{ listStyle: "none", margin: 0, padding: 0, display: "grid", gap: 12 }}>
          {alunosFiltrados.map(({ aluno, nivel }) => {
            const rs = RISCO_STYLE[nivel];
            return (
              <li key={aluno.id}>
                <button onClick={() => onAbrirAluno(aluno.id)} className="row-card">
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 15.5 }}>{aluno.nome}</div>
                    <div style={{ fontSize: 13, color: "var(--text-muted)", marginTop: 2 }}>
                      {aluno.turma} · resp.: {aluno.responsavel}
                      {aluno.planoStatus && aluno.risco.nivel !== "baixo" && <> · plano: <span style={{ color: STATUS_PLANO[aluno.planoStatus].cor, fontWeight: 600 }}>{STATUS_PLANO[aluno.planoStatus].label.toLowerCase()}</span></>}
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span className="risk-badge" style={{ background: rs.bg, color: rs.cor, border: `1px solid ${rs.border}`, fontSize: 12.5, padding: "5px 11px" }}>
                      {rs.label}
                    </span>
                    <Icon name="chevron-right" size={15} color="var(--text-faint)" />
                  </div>
                </button>
              </li>
            );
          })}
        </ul>
      )}
    </Page>
  );
}

/* ---------------------- ORIENTADOR: cadastrar aluno ---------------------- */

function CadastrarAluno({ onCancelar, onSalvar }) {
  const [nome, setNome] = useState("");
  const [turma, setTurma] = useState("");
  const [responsavelId, setResponsavelId] = useState("");
  const [responsaveis, setResponsaveis] = useState([]);
  const [salvando, setSalvando] = useState(false);

  useEffect(() => {
    api.get("/responsaveis").then(setResponsaveis).catch(() => setResponsaveis([]));
  }, []);

  const invalido = nome.trim().length < 3 || turma.trim().length < 2;

  return (
    <Page max={520}>
      <div className="eyebrow">novo cadastro</div>
      <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, margin: "4px 0 20px" }}>Cadastrar aluno</h1>

      <form
        className="card" style={{ padding: 20 }}
        onSubmit={async (e) => {
          e.preventDefault();
          if (invalido || salvando) return;
          setSalvando(true);
          await onSalvar({ nome: nome.trim(), turma: turma.trim(), responsavelId: responsavelId || null });
          setSalvando(false);
        }}
      >
        <label className="field-label" htmlFor="aluno-nome">Nome completo</label>
        <input id="aluno-nome" className="field" value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome do aluno" />

        <label className="field-label" htmlFor="aluno-turma" style={{ marginTop: 14 }}>Turma</label>
        <input id="aluno-turma" className="field" value={turma} onChange={(e) => setTurma(e.target.value)} placeholder="ex.: 7º ano A" />

        <label className="field-label" htmlFor="aluno-responsavel" style={{ marginTop: 14 }}>Responsável vinculado</label>
        <select id="aluno-responsavel" className="field" value={responsavelId} onChange={(e) => setResponsavelId(e.target.value)}>
          <option value="">Vincular depois</option>
          {responsaveis.map((r) => <option key={r.id} value={r.id}>{r.nome} ({r.email})</option>)}
        </select>

        <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
          <button type="button" className="btn-ghost" onClick={onCancelar} style={{ flex: 1 }}>Cancelar</button>
          <button
            type="submit" className="btn-primary" style={{ flex: 1, justifyContent: "center" }}
            disabled={invalido || salvando} aria-busy={salvando} aria-describedby={invalido ? "aluno-hint" : undefined}
          >
            {salvando ? "Salvando..." : "Salvar"}
          </button>
        </div>
        {invalido && (
          <p id="aluno-hint" style={{ fontSize: 12.5, color: "var(--text-muted)", marginTop: 10 }}>Preencha nome e turma para habilitar o cadastro.</p>
        )}
      </form>
    </Page>
  );
}

/* ---------------------- ORIENTADOR: registrar indicador ---------------------- */

function RegistrarIndicador({ aluno, onRegistrar, onEditar, onExcluir, onStatusPlano }) {
  const [tab, setTab] = useState("nota");
  const risco = classificarRisco(aluno);
  const rs = RISCO_STYLE[risco.nivel];

  return (
    <Page max={640}>
      <div className="eyebrow">registro de indicador</div>
      <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, margin: "4px 0 4px" }}>{aluno.nome}</h1>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ fontSize: 13.5, color: "var(--text-muted)" }}>{aluno.turma}</span>
        <span className="risk-badge" style={{ background: rs.bg, color: rs.cor, border: `1px solid ${rs.border}`, fontSize: 12, padding: "3px 10px" }}>{rs.label}</span>
      </div>
      <div style={{ marginBottom: 20 }}><ExplicacaoRisco risco={risco} /><EvolucaoRisco evolucao={aluno.evolucao} atual={aluno.risco.nivel} /></div>
      <PlanoEFeedbacks aluno={aluno} onStatusPlano={onStatusPlano} />
      <ReforcoPorAssunto reforcos={aluno.reforcosAtuais} />

      <div className="tabs">
        {Object.entries(TABS).map(([key, t]) => {
          const ativo = tab === key;
          return (
            <button
              key={key} onClick={() => setTab(key)} className={ativo ? "tab" : "tab is-inactive"}
              style={{ background: ativo ? t.color : "transparent", color: ativo ? "#fff" : "var(--text-muted)", borderColor: t.color }}
            >
              <Icon name={t.icon} size={13} /> {t.label}
            </button>
          );
        })}
      </div>

      <div className="card" style={{ padding: 20, borderTop: `3px solid ${TABS[tab].color}` }}>
        {tab === "nota" && <FormNota onSalvar={(d) => onRegistrar("nota", d)} />}
        {tab === "falta" && <FormFalta onSalvar={(d) => onRegistrar("falta", d)} />}
        {tab === "ocorrencia" && <FormOcorrencia onSalvar={(d) => onRegistrar("ocorrencia", d)} />}
        {tab === "saida" && <FormSaida onSalvar={(d) => onRegistrar("saida", d)} />}
      </div>

      <HistoricoIndicadores aluno={aluno} onEditar={onEditar} onExcluir={onExcluir} />
    </Page>
  );
}

function FormNota({ onSalvar }) {
  const [disciplina, setDisciplina] = useState("");
  const [assunto, setAssunto] = useState("");
  const [valor, setValor] = useState("");
  const [periodo, setPeriodo] = useState("3º bimestre");
  const valorNum = parseFloat(valor);
  const foraDaFaixa = valor !== "" && (Number.isNaN(valorNum) || valorNum < 0 || valorNum > 10);
  const invalido = !disciplina || !assunto.trim() || valor === "" || foraDaFaixa;
  return (
    <form
      onSubmit={(e) => {
        e.preventDefault();
        if (invalido) return;
        onSalvar({ disciplina, assunto: assunto.trim(), valor: parseFloat(valor), periodo });
      }}
    >
      <label className="field-label" htmlFor="nota-disciplina">Disciplina</label>
      <input id="nota-disciplina" className="field" value={disciplina} onChange={(e) => setDisciplina(e.target.value)} placeholder="ex.: Matemática" />
      <label className="field-label" htmlFor="nota-assunto" style={{ marginTop: 14 }}>Assunto avaliado</label>
      <input id="nota-assunto" className="field" value={assunto} onChange={(e) => setAssunto(e.target.value)} placeholder="ex.: Frações, Concordância verbal" maxLength={160} />
      <p style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 6 }}>
        O assunto entra no plano de ação: se a nota ficar baixa, o sistema indica o que reforçar e como ensinar.
      </p>
      <div style={{ display: "flex", gap: 12, marginTop: 14 }}>
        <div style={{ flex: 1 }}>
          <label className="field-label" htmlFor="nota-valor">Nota (0–10)</label>
          <input
            id="nota-valor" className="field" type="number" min="0" max="10" step="0.1"
            value={valor} onChange={(e) => setValor(e.target.value)}
            aria-invalid={foraDaFaixa} aria-describedby={foraDaFaixa ? "nota-valor-erro" : undefined}
          />
          {foraDaFaixa && (
            <p id="nota-valor-erro" style={{ fontSize: 12, color: "var(--danger)", marginTop: 6 }}>A nota deve estar entre 0 e 10.</p>
          )}
        </div>
        <div style={{ flex: 1 }}>
          <label className="field-label" htmlFor="nota-periodo">Período</label>
          <select id="nota-periodo" className="field" value={periodo} onChange={(e) => setPeriodo(e.target.value)}>
            <option>1º bimestre</option><option>2º bimestre</option><option>3º bimestre</option><option>4º bimestre</option>
          </select>
        </div>
      </div>
      <button
        type="submit" className="btn-primary" style={{ marginTop: 18, justifyContent: "center", width: "100%" }}
        disabled={invalido} aria-describedby={invalido && !foraDaFaixa ? "nota-hint" : undefined}
      >
        Registrar nota
      </button>
      {invalido && !foraDaFaixa && (
        <p id="nota-hint" style={{ fontSize: 12.5, color: "var(--text-muted)", marginTop: 8 }}>Preencha disciplina, assunto e nota para habilitar o registro.</p>
      )}
    </form>
  );
}

function FormFalta({ onSalvar }) {

function formatarData(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}`;
}

function EditorIndicador({ tipo, dados, onSalvar, onCancelar }) {
  const inputStyle = { flex: "1 1 120px" };

  if (tipo === "nota") {
    const [disciplina, setDisciplina] = useState(dados.disciplina);
    const [assunto, setAssunto] = useState(dados.assunto || "");
    const [valor, setValor] = useState(String(dados.valor));
    const [periodo, setPeriodo] = useState(dados.periodo);
    const valorNum = parseFloat(valor);
    const foraDaFaixa = valor !== "" && (Number.isNaN(valorNum) || valorNum < 0 || valorNum > 10);
    const invalido = !disciplina || !assunto.trim() || valor === "" || foraDaFaixa;
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 8, width: "100%" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input className="field" style={inputStyle} value={disciplina} onChange={(e) => setDisciplina(e.target.value)} aria-label="Disciplina" />
          <input className="field" style={inputStyle} value={assunto} onChange={(e) => setAssunto(e.target.value)} aria-label="Assunto avaliado" placeholder="Assunto" maxLength={160} />
          <input className="field" style={{ flex: "1 1 80px" }} type="number" min="0" max="10" step="0.1" value={valor} onChange={(e) => setValor(e.target.value)} aria-label="Nota" />
          <select className="field" style={inputStyle} value={periodo} onChange={(e) => setPeriodo(e.target.value)} aria-label="Período">
            <option>1º bimestre</option><option>2º bimestre</option><option>3º bimestre</option><option>4º bimestre</option>
          </select>
        </div>
        {foraDaFaixa && <p style={{ fontSize: 12, color: "var(--danger)", margin: 0 }}>A nota deve estar entre 0 e 10.</p>}
        <div style={{ display: "flex", gap: 8 }}>
          <button type="button" disabled={invalido} onClick={() => onSalvar({ disciplina, assunto: assunto.trim(), valor: parseFloat(valor), periodo })} className="btn-primary" style={{ padding: "6px 14px", fontSize: 13 }}>Salvar</button>
          <button type="button" onClick={onCancelar} className="btn-ghost" style={{ padding: "6px 14px", fontSize: 13 }}>Cancelar</button>
        </div>
      </div>
    );
  }

  if (tipo === "falta") {
    const [data, setData] = useState(dados.dataIso);
    const [justificada, setJustificada] = useState(dados.justificada);
    const [comprovante, setComprovante] = useState(dados.comprovante || "");
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 8, width: "100%" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <input className="field" style={{ flex: "1 1 100px" }} type="date" max={hojeIso()} value={data} onChange={(e) => setData(e.target.value)} aria-label="Data" />
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5 }}>
            <input type="checkbox" checked={justificada} onChange={(e) => setJustificada(e.target.checked)} />
            Justificada
          </label>
        </div>
        {justificada && (
          <textarea className="field" rows={2} value={comprovante} onChange={(e) => setComprovante(e.target.value)} placeholder="Observação / comprovante" aria-label="Observação / comprovante" />
        )}
        <div style={{ display: "flex", gap: 8 }}>
          <button type="button" disabled={!data} onClick={() => onSalvar({ data, justificada, comprovante: justificada ? comprovante : "" })} className="btn-primary" style={{ padding: "6px 14px", fontSize: 13 }}>Salvar</button>
          <button type="button" onClick={onCancelar} className="btn-ghost" style={{ padding: "6px 14px", fontSize: 13 }}>Cancelar</button>
        </div>
      </div>
    );
  }

  if (tipo === "ocorrencia") {
    const [descricao, setDescricao] = useState(dados.descricao);
    const [gravidade, setGravidade] = useState(dados.gravidade);
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 8, width: "100%" }}>
        <textarea className="field" rows={2} value={descricao} onChange={(e) => setDescricao(e.target.value)} aria-label="Descrição" />
        <select className="field" style={{ maxWidth: 160 }} value={gravidade} onChange={(e) => setGravidade(e.target.value)} aria-label="Gravidade">
          <option value="leve">Leve</option><option value="moderada">Moderada</option><option value="grave">Grave</option>
        </select>
        <div style={{ display: "flex", gap: 8 }}>
          <button type="button" disabled={!descricao} onClick={() => onSalvar({ descricao, gravidade })} className="btn-primary" style={{ padding: "6px 14px", fontSize: 13 }}>Salvar</button>
          <button type="button" onClick={onCancelar} className="btn-ghost" style={{ padding: "6px 14px", fontSize: 13 }}>Cancelar</button>
        </div>
      </div>
    );
  }

  // tipo === "saida"
  const [data, setData] = useState(dados.dataIso);
  const [horario, setHorario] = useState(dados.horario);
  const [motivo, setMotivo] = useState(dados.motivo);
  const invalido = !data || !motivo;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8, width: "100%" }}>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input className="field" style={{ flex: "1 1 100px" }} type="date" max={hojeIso()} value={data} onChange={(e) => setData(e.target.value)} aria-label="Data" />
        <input className="field" style={{ flex: "1 1 100px" }} type="time" value={horario} onChange={(e) => setHorario(e.target.value)} aria-label="Horário" />
      </div>
      <input className="field" value={motivo} onChange={(e) => setMotivo(e.target.value)} aria-label="Motivo" />
      <div style={{ display: "flex", gap: 8 }}>
        <button type="button" disabled={invalido} onClick={() => onSalvar({ data, horario, motivo })} className="btn-primary" style={{ padding: "6px 14px", fontSize: 13 }}>Salvar</button>
        <button type="button" onClick={onCancelar} className="btn-ghost" style={{ padding: "6px 14px", fontSize: 13 }}>Cancelar</button>
      </div>
    </div>
  );
}

function HistoricoIndicadores({ aluno, onEditar, onExcluir }) {
  const [confirmando, setConfirmando] = useState(null);
  const [editando, setEditando] = useState(null);
  const itens = [
    ...aluno.notas.map((n) => ({ tipo: "nota", id: n.id, dados: n, texto: `${n.disciplina}${n.assunto ? ` · ${n.assunto}` : ""}: nota ${n.valor} (${n.periodo})` })),
    ...aluno.faltas.map((f) => ({
      tipo: "falta", id: f.id, dados: f,
      texto: `Falta em ${f.data}${f.justificada ? ` · justificada${f.comprovante ? ` (${f.comprovante})` : ""}` : ""}`,
    })),
    ...aluno.ocorrencias.map((o) => ({ tipo: "ocorrencia", id: o.id, dados: o, texto: `${o.descricao} · gravidade ${o.gravidade}` })),
    ...aluno.saidas.map((s) => ({ tipo: "saida", id: s.id, dados: s, texto: `Saída antecipada em ${s.data} às ${s.horario} · ${s.motivo}` })),
  ];
  return (
    <div style={{ marginTop: 26 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name="clock-rotate-left" size={14} color="var(--text-muted)" />
        <span style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text-muted)" }}>Histórico registrado</span>
      </div>
      {itens.length === 0 ? (
        <p style={{ fontSize: 13.5, color: "var(--text-muted)" }}>Nenhum indicador registrado ainda para este aluno.</p>
      ) : (
        <ul style={{ listStyle: "none", margin: 0, padding: 0, display: "grid", gap: 8 }}>
          {itens.map((it) => {
            const emEdicao = editando === it.id;
            return (
              <li
                key={it.id}
                style={{
                  display: "flex", alignItems: emEdicao ? "stretch" : "center", flexDirection: emEdicao ? "column" : "row",
                  gap: 10, fontSize: 13.5, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 8, padding: "9px 12px",
                }}
              >
                {emEdicao ? (
                  <EditorIndicador
                    tipo={it.tipo}
                    dados={it.dados}
                    onSalvar={(novosDados) => { onEditar(it.tipo, it.id, novosDados); setEditando(null); }}
                    onCancelar={() => setEditando(null)}
                  />
                ) : confirmando === it.id ? (
                  <>
                    <span style={{ width: 8, height: 8, borderRadius: 99, background: TABS[it.tipo].color, flexShrink: 0 }} />
                    <span style={{ flex: 1 }}>{it.texto}</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                      <span style={{ fontSize: 12, color: "var(--text-muted)" }}>Excluir?</span>
                      <button
                        type="button"
                        onClick={() => { onExcluir(it.tipo, it.id); setConfirmando(null); }}
                        style={{ background: "none", border: "1px solid var(--danger-border)", color: "var(--danger)", borderRadius: 6, padding: "3px 9px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
                      >
                        Sim
                      </button>
                      <button
                        type="button"
                        onClick={() => setConfirmando(null)}
                        style={{ background: "none", border: "1px solid var(--border-strong)", color: "var(--text-muted)", borderRadius: 6, padding: "3px 9px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
                      >
                        Não
                      </button>
                    </span>
                  </>
                ) : (
                  <>
                    <span style={{ width: 8, height: 8, borderRadius: 99, background: TABS[it.tipo].color, flexShrink: 0 }} />
                    <span style={{ flex: 1 }}>{it.texto}</span>
                    <span style={{ display: "flex", gap: 2, flexShrink: 0 }}>
                      {onEditar && (
                        <button
                          type="button"
                          onClick={() => { setEditando(it.id); setConfirmando(null); }}
                          aria-label={`Editar registro: ${it.texto}`}
                          style={{ background: "none", border: "none", color: "var(--text-faint)", cursor: "pointer", padding: 6, display: "flex" }}
                        >
                          <Icon name="pen" size={13} />
                        </button>
                      )}
                      {onExcluir && (
                        <button
                          type="button"
                          onClick={() => { setConfirmando(it.id); setEditando(null); }}
                          aria-label={`Excluir registro: ${it.texto}`}
                          style={{ background: "none", border: "none", color: "var(--text-faint)", cursor: "pointer", padding: 6, display: "flex" }}
                        >
                          <Icon name="trash" size={13} />
                        </button>
                      )}
                    </span>
                  </>
                )}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

/* ---------------------- RESPONSÁVEL: painel de risco ---------------------- */

function PainelResponsavel({ aluno, avisos, filhos, onTrocarAluno, onVerPlano }) {
  const { nivel, causaPrincipal } = classificarRisco(aluno);
  const rs = RISCO_STYLE[nivel];
  const totalIndicadores = aluno.notas.length + aluno.faltas.length + aluno.ocorrencias.length + aluno.saidas.length;

  return (
    <Page>
      {avisos}
      <div className="eyebrow">painel de risco</div>
      <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, margin: "4px 0 22px" }}>
        Olá, {aluno.responsavel.split(" ")[0]}
      </h1>
      {filhos && filhos.length > 1 && (
        <div style={{ marginTop: -12, marginBottom: 18, maxWidth: 280 }}>
          <label className="field-label" htmlFor="trocar-aluno">Acompanhando</label>
          <select id="trocar-aluno" className="field" value={aluno.id} onChange={(e) => onTrocarAluno(e.target.value)}>
            {filhos.map((f) => <option key={f.id} value={f.id}>{f.nome}</option>)}
          </select>
        </div>
      )}

      <div className="card" style={{ padding: 24, borderLeft: `3px solid ${rs.cor}` }}>
        <div style={{ fontSize: 13, color: "var(--text-muted)" }}>{aluno.nome} · {aluno.turma}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
          {nivel !== "baixo" && <Icon name="triangle-exclamation" size={20} color={rs.cor} />}
          <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, color: rs.cor }}>{rs.label}</span>
        </div>
        {nivel !== "baixo" && causaPrincipal && (
          <p style={{ fontSize: 13, color: "var(--text-muted)", marginTop: 6 }}>
            Motivo principal: <strong style={{ color: "var(--text)" }}>{CAUSA_LABEL[causaPrincipal]}</strong>
          </p>
        )}
        <p style={{ fontSize: 13.5, color: "var(--text-muted)", marginTop: 10, lineHeight: 1.55 }}>
          {nivel === "baixo"
            ? "Nenhum sinal de risco identificado no momento. Continue acompanhando por aqui."
            : "O motor de correlação identificou um padrão que pede atenção. Veja o plano de ação sugerido pela escola."}
        </p>
        {nivel !== "baixo" && (
          <button className="btn-primary" style={{ marginTop: 16 }} onClick={onVerPlano}>
            <Icon name="clipboard-list" size={15} /> Ver plano de ação
          </button>
        )}
        <ExplicacaoRisco risco={classificarRisco(aluno)} />
        <EvolucaoRisco evolucao={aluno.evolucao} atual={aluno.risco.nivel} />
      </div>

      {!aluno.planoAcao && aluno.reforcosAtuais.length > 0 && (
        <div style={{ marginTop: 18 }}><ReforcoPorAssunto reforcos={aluno.reforcosAtuais} /></div>
      )}

      <div style={{ marginTop: 26 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text-muted)", marginBottom: 10 }}>
          Histórico de acompanhamento ({totalIndicadores} registros)
        </div>
        <HistoricoIndicadores aluno={aluno} />
      </div>
    </Page>
  );
}

/* ---------------------- RESPONSÁVEL: plano de ação ---------------------- */

/** O que reforçar (disciplina + assunto) e como: recomendações de ensino e orientação para casa. */
function ReforcoPorAssunto({ reforcos }) {
  if (!reforcos || reforcos.length === 0) return null;
  return (
    <section className="card" style={{ padding: 20, marginBottom: 18 }} aria-labelledby="reforco-titulo">
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <Icon name="book-open" size={16} color="var(--accent)" />
        <h2 id="reforco-titulo" style={{ fontWeight: 600, fontSize: 14.5, margin: 0 }}>O que reforçar</h2>
      </div>
      <div style={{ display: "grid", gap: 14 }}>
        {reforcos.map((r) => (
          <div key={`${r.disciplina}-${r.assunto}`} style={{ border: "1px solid var(--border)", borderLeft: `3px solid ${TABS.nota.color}`, borderRadius: 8, padding: "12px 14px" }}>
            <div style={{ display: "flex", flexWrap: "wrap", alignItems: "baseline", gap: 8 }}>
              <strong style={{ fontSize: 14.5 }}>{r.disciplina}</strong>
              {r.assunto && <span className="risk-badge" style={{ background: "transparent", color: "var(--text)", border: "1px solid var(--border-strong)", fontSize: 12, padding: "2px 9px", textTransform: "none", letterSpacing: 0 }}>{r.assunto}</span>}
            </div>
            <p style={{ fontSize: 13, color: "var(--text-muted)", margin: "6px 0 10px" }}>{r.resumo}</p>
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-muted)", marginBottom: 4 }}>RECOMENDAÇÕES DE ENSINO</div>
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, lineHeight: 1.55 }}>
              {r.ensino.map((t, i) => <li key={i}>{t}</li>)}
            </ul>
            {r.familia.map((t, i) => (
              <p key={i} style={{ fontSize: 13, margin: "10px 0 0", display: "flex", gap: 8, color: "var(--text-muted)" }}>
                <Icon name="house" size={13} style={{ marginTop: 3 }} /> <span><strong style={{ color: "var(--text)" }}>Em casa:</strong> {t.replace(/^Em casa: /, "")}</span>
              </p>
            ))}
          </div>
        ))}
      </div>
    </section>
  );
}

function PlanoDeAcao({ aluno, onFeedback, solicitacoes, onAgendar, onAceitar }) {
  const [status, setStatus] = useState("em_andamento");
  const [observacao, setObservacao] = useState("");
  const [enviado, setEnviado] = useState(false);
  const plano = aluno.planoAcao;

  if (!plano) {
    return (
      <Page>
        <p style={{ color: "var(--text-muted)" }}>Nenhum plano de ação ativo no momento.</p>
      </Page>
    );
  }

  return (
    <Page>
      <div className="eyebrow">sugestão pedagógica</div>
      <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, margin: "4px 0 6px" }}>
        Plano de ação — {aluno.nome}
      </h1>
      <p style={{ fontSize: 13.5, color: "var(--text-muted)", marginBottom: 20 }}>
        Causa principal identificada: <strong style={{ color: "var(--text)" }}>{CAUSA_LABEL[plano.causa]}</strong>
      </p>
      {plano.status && (
        <div style={{ marginTop: -10, marginBottom: 18, fontSize: 13, color: "var(--text-muted)", display: "flex", alignItems: "center", gap: 8 }}>
          Status do plano: <Selo estilo={STATUS_PLANO[plano.status]} />
        </div>
      )}

      <ReforcoPorAssunto reforcos={plano.reforcos} />

      <div className="card" style={{ padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <Icon name="lightbulb" size={16} color="var(--warning)" />
          <span style={{ fontWeight: 600, fontSize: 14.5 }}>Sugestões da matriz pedagógica</span>
        </div>
        <div style={{ display: "grid", gap: 10 }}>
          {plano.sugestoes.map((s, i) => <div key={i} className="sticky-note">{s}</div>)}
        </div>
      </div>

      <div className="card" style={{ padding: 20, marginTop: 18 }}>
        <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 12 }}>Registrar feedback de resolução</div>
        {enviado ? (
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--success)", fontSize: 14 }}>
            <Icon name="circle-check" size={16} /> Feedback enviado. Obrigado por acompanhar!
          </div>
        ) : (
          <form
            onSubmit={(e) => {
              e.preventDefault();
              onFeedback(status, observacao);
              setEnviado(true);
            }}
          >
            <label className="field-label" htmlFor="plano-status">Status</label>
            <select id="plano-status" className="field" value={status} onChange={(e) => setStatus(e.target.value)}>
              <option value="em_andamento">Em andamento</option>
              <option value="resolvido">Resolvido</option>
            </select>
            <label className="field-label" htmlFor="plano-observacao" style={{ marginTop: 14 }}>Observação</label>
            <textarea id="plano-observacao" className="field" rows={3} value={observacao} onChange={(e) => setObservacao(e.target.value)} placeholder="Conte como está o acompanhamento em casa..." />
            <button type="submit" className="btn-primary" style={{ marginTop: 16, justifyContent: "center", width: "100%" }}>
              Enviar feedback
            </button>
          </form>
        )}

        {aluno.feedbacks.length > 0 && (
          <div style={{ marginTop: 18, borderTop: "1px solid var(--border)", paddingTop: 14 }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-muted)", marginBottom: 8 }}>FEEDBACKS ANTERIORES</div>
            {aluno.feedbacks.map((f) => (
              <div key={f.id} style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 6 }}>
                <strong style={{ color: "var(--text)" }}>{f.status === "resolvido" ? "Resolvido" : "Em andamento"}:</strong> {f.observacao || "—"}
              </div>
            ))}
          </div>
        )}
      </div>
      <AgendarConversa aluno={aluno} solicitacoes={solicitacoes} onAgendar={onAgendar} onAceitar={onAceitar} />
    </Page>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
