# Roda a suíte de testes da API a cada push e pull request.
# Cumpre o Plano de Execução (Eixo 2 §2.3): testes automatizados a cada commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escolaalerta
          POSTGRES_PASSWORD: escolaalerta
          POSTGRES_DB: escolaalerta_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U escolaalerta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgres://escolaalerta:escolaalerta@localhost:5433/escolaalerta_test
      JWT_SECRET: segredo-somente-para-ci
      FRONT_URL: http://localhost:5500

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
